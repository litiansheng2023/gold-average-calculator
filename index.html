<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>金策 · 均价计算器</title>
  <style>
    /* ========== 主题变量 ========== */
    :root[data-theme="light"] {
      --bg-base: #f8f9fa;
      --bg-card: #ffffff;
      --bg-input: #f1f3f5;
      --border-color: #e5e7eb;
      --border-gold: rgba(180, 140, 50, 0.4);
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --text-dark: #9ca3af;
      --gold-main: #b48524; 
      --gold-glow: rgba(180, 133, 36, 0.15);
      --shadow-color: rgba(0, 0, 0, 0.05);
      --bg-radial: radial-gradient(circle at 50% 0%, var(--gold-glow) 0%, transparent 50%);
      
      --btn-bg: #fdfaf2;
      --btn-border: #d4b46a;
      --btn-text: #8c6415;
      --btn-shadow: 0 2px 8px rgba(180, 140, 50, 0.15);
      --btn-hover-bg-solid: #f7efd9;
      --btn-active-bg: #efe3c3;

      --tab-bg: #f1f3f5;
      --tab-active-bg: #ffffff;
    }

    :root[data-theme="dark"] {
      --bg-base: #09090b;
      --bg-card: #121214;
      --bg-input: #18181b;
      --border-color: #27272a;
      --border-gold: rgba(212, 175, 55, 0.3);
      --text-main: #f4f4f5;
      --text-muted: #a1a1aa;
      --text-dark: #52525b;
      --gold-main: #e6c875;
      --gold-glow: rgba(230, 200, 117, 0.15);
      --shadow-color: rgba(0, 0, 0, 0.4);
      --bg-radial: radial-gradient(circle at 50% 0%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
      
      --btn-bg: linear-gradient(180deg, rgba(230, 200, 117, 0.15) 0%, rgba(230, 200, 117, 0.05) 100%);
      --btn-border: rgba(230, 200, 117, 0.5);
      --btn-text: #fceeb5;
      --btn-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 4px 12px rgba(0, 0, 0, 0.3);
      --btn-hover-bg-solid: linear-gradient(180deg, rgba(230, 200, 117, 0.25) 0%, rgba(230, 200, 117, 0.1) 100%);
      --btn-active-bg: rgba(230, 200, 117, 0.1);

      --tab-bg: #18181b;
      --tab-active-bg: #27272a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", "PingFang SC", "Hiragino Sans", "Microsoft YaHei", sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    body {
      background-color: var(--bg-base);
      background-image: var(--bg-radial);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: var(--font-sans);
      color: var(--text-main);
      transition: background-color 1s ease, color 1s ease;
    }

    .calc-card, .input-group input, .result-box, .theme-toggle, .terminal-header, h1, label, span {
      transition: background-color 1s ease, border-color 1s ease, color 1s ease, box-shadow 1s ease;
    }

    /* ========== 时光流逝扩散动画 ========== */
    ::view-transition-old(root),
    ::view-transition-new(root) {
      animation: none;
      mix-blend-mode: normal;
    }
    ::view-transition-old(root) { z-index: 1; }
    ::view-transition-new(root) {
      z-index: 2;
      animation: revealCircle 2.2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes revealCircle {
      from { clip-path: circle(0% at var(--click-x) var(--click-y)); }
      to { clip-path: circle(150% at var(--click-x) var(--click-y)); }
    }

    /* ========== 布局框架 ========== */
    .terminal-container {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      gap: 2rem;
      position: relative;
    }

    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .terminal-header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .terminal-header h1::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 20px;
      background-color: var(--gold-main);
      border-radius: 2px;
    }

    .terminal-subtitle {
      font-size: 0.75rem;
      color: var(--text-dark);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-weight: 600;
      margin-left: 1rem;
    }

    /* 主题切换胶囊 */
    .theme-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 76px;
      height: 34px;
      background-color: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 50px;
      padding: 3px;
      cursor: pointer;
      position: relative;
      box-shadow: inset 0 2px 4px var(--shadow-color);
      user-select: none;
    }

    .theme-toggle .icon {
      width: 26px;
      height: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      z-index: 1;
      transition: opacity 0.4s ease;
    }

    .theme-toggle .slider {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 26px;
      height: 26px;
      background-color: var(--bg-card);
      border-radius: 50%;
      box-shadow: 0 2px 5px var(--shadow-color);
      transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 0;
    }

    [data-theme="dark"] .theme-toggle .slider {
      transform: translateX(42px);
    }

    .sun-icon { opacity: 1; color: #f59e0b; }
    .moon-icon { opacity: 0.4; color: #818cf8; }
    [data-theme="dark"] .sun-icon { opacity: 0.4; }
    [data-theme="dark"] .moon-icon { opacity: 1; }

    /* ========== 手机端选项卡导航 (默认隐藏) ========== */
    .mobile-tabs {
      display: none; 
      background-color: var(--tab-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px;
      position: relative;
      box-shadow: inset 0 1px 3px var(--shadow-color);
    }

    .mobile-tab-btn {
      flex: 1;
      padding: 0.6rem 0;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      border-radius: 6px;
      z-index: 1;
      position: relative;
      transition: color 0.3s;
      background: transparent;
      border: none;
      font-family: inherit;
    }

    .mobile-tab-btn.active {
      color: var(--gold-main);
    }

    .mobile-tab-slider {
      position: absolute;
      top: 4px;
      left: 4px;
      width: calc(50% - 4px);
      height: calc(100% - 8px);
      background-color: var(--tab-active-bg);
      border-radius: 6px;
      box-shadow: 0 2px 8px var(--shadow-color), 0 0 0 1px var(--border-gold);
      transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      z-index: 0;
    }

    /* ========== 计算器卡片区 ========== */
    .calc-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      position: relative;
    }

    .calc-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 4px 20px var(--shadow-color);
      position: relative;
      overflow: hidden;
    }

    .calc-card:hover {
      border-color: var(--border-gold);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 1px dashed var(--border-color);
    }

    .card-title {
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
      letter-spacing: 1px;
    }

    .card-tag {
      font-size: 0.7rem;
      color: var(--gold-main);
      background: var(--btn-hover-bg);
      padding: 0.2rem 0.6rem;
      border-radius: 4px;
      font-family: var(--font-mono);
      border: 1px solid var(--border-gold);
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.2rem;
    }

    .input-group label {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .input-group input {
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 0.8rem 1rem;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-main);
      outline: none;
      font-family: var(--font-mono);
    }

    .input-group input:focus {
      border-color: var(--gold-main);
      box-shadow: 0 0 0 2px var(--gold-glow);
    }

    .input-group input::placeholder {
      color: var(--text-dark);
    }

    .calc-btn {
      width: 100%;
      background: var(--btn-bg);
      border: 1px solid var(--btn-border);
      border-radius: 6px;
      padding: 0.9rem;
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--btn-text);
      cursor: pointer;
      margin-top: 0.5rem;
      font-family: var(--font-sans);
      box-shadow: var(--btn-shadow);
      transition: all 0.2s ease;
    }

    .calc-btn:hover {
      background: var(--btn-hover-bg-solid);
      border-color: var(--gold-main);
    }

    .calc-btn:active {
      background: var(--btn-active-bg);
      transform: translateY(2px);
      box-shadow: none;
    }

    .result-box {
      margin-top: 1.5rem;
      background: var(--bg-input);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem 1.2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 72px;
    }

    .result-label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .result-value {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--gold-main);
      font-family: var(--font-mono);
      text-shadow: 0 0 10px var(--gold-glow);
    }

    .result-value.empty {
      color: var(--text-dark);
      font-weight: 400;
      font-size: 1rem;
      text-shadow: none;
    }

    .terminal-footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-dark);
      margin-top: 1rem;
      letter-spacing: 0.5px;
    }

    /* ========== 响应式（手机端专属改造） ========== */
    @media (max-width: 768px) {
      body {
        padding: 1rem 1rem 2rem 1rem;
        align-items: flex-start;
        padding-top: 1rem; /* 减少顶部留白 */
      }

      /* 修复标题重叠：改为左右分布 */
      .terminal-header {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 0.8rem; /* 减少底部留白 */
        margin-bottom: 0.5rem;
      }

      .header-left {
        gap: 0.2rem;
      }

      .terminal-header h1 {
        font-size: 1.2rem;
      }
      
      .terminal-header h1::before {
        height: 16px;
        width: 3px;
      }

      .terminal-subtitle {
        font-size: 0.65rem;
        margin-left: 0.5rem;
      }

      /* 取消绝对定位，使之与标题并排 */
      .theme-toggle {
        position: static; 
        transform: scale(0.9); /* 稍微缩小一点 */
        flex-shrink: 0;
      }

      /* 显示手机端选项卡 */
      .mobile-tabs {
        display: flex;
        margin-top: 0.5rem;
        margin-bottom: 0.2rem;
      }

      .mobile-tab-btn {
        padding: 0.5rem 0; /* 压缩按钮高度 */
      }

      /* 卡片区改为相对定位，方便动画 */
      .calc-grid {
        grid-template-columns: 1fr;
        gap: 0; 
      }

      /* 隐藏非激活的卡片，保留滑动动画 */
      .calc-card {
        display: none;
        animation: slideFadeIn 0.3s ease-out forwards;
        margin-top: 1rem;
        padding: 1.2rem 1rem; /* 缩小卡片内边距 */
      }

      .calc-card.active-card {
        display: block;
      }

      @keyframes slideFadeIn {
        from { opacity: 0; transform: translateX(10px); }
        to { opacity: 1; transform: translateX(0); }
      }

      /* 压缩卡片内部的垂直空间，让结果显示出来 */
      .card-header {
        margin-bottom: 1rem;
        padding-bottom: 0.8rem;
      }

      .input-group {
        margin-bottom: 0.8rem; /* 缩小输入框之间的间距 */
        gap: 0.3rem;
      }

      .input-group input {
        padding: 0.6rem 0.8rem; /* 缩小输入框高度 */
        font-size: 0.95rem;
      }

      .calc-btn {
        padding: 0.7rem; /* 缩小按钮高度 */
        margin-top: 0.2rem;
      }

      .result-box {
        margin-top: 1rem;
        padding: 0.8rem 1rem;
        min-height: 60px; /* 缩小结果框高度 */
      }

      /* 调整手机上显示的数字大小 */
      .result-value {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>
  <div class="terminal-container">
    
    <!-- 头部 -->
    <div class="terminal-header">
      <div class="header-left">
        <h1>金策 · 均价计算器</h1>
        <div class="terminal-subtitle">JINCE / AVERAGE PRICE TERMINAL</div>
      </div>
      
      <!-- 主题切换 -->
      <div class="theme-toggle" id="themeToggle" title="切换主题">
        <div class="slider"></div>
        <div class="icon sun-icon">☀</div>
        <div class="icon moon-icon">☾</div>
      </div>
    </div>

    <!-- 手机端专属选项卡 -->
    <div class="mobile-tabs">
      <div class="mobile-tab-slider" id="tabSlider"></div>
      <button class="mobile-tab-btn active" data-target="card-buy">补仓计算</button>
      <button class="mobile-tab-btn" data-target="card-avg">新均价预估</button>
    </div>

    <!-- 计算器卡片区 -->
    <div class="calc-grid">
      
      <!-- 左侧/第一个：补仓克数计算 -->
      <div class="calc-card active-card" id="card-buy">
        <div class="card-header">
          <div class="card-title">补仓克数计算</div>
          <div class="card-tag">TARGET AVG</div>
        </div>

        <div class="input-group">
          <label>当前均价 (¥/g)</label>
          <input type="number" id="avgPrice1" placeholder="480.00" step="0.01" value="450.00">
        </div>
        <div class="input-group">
          <label>持有克数 (g)</label>
          <input type="number" id="holdGrams1" placeholder="20.00" step="0.01" value="20.00">
        </div>
        <div class="input-group">
          <label>当前金价 (¥/g)</label>
          <input type="number" id="currentPrice1" placeholder="500.00" step="0.01" value="500.00">
        </div>
        <div class="input-group">
          <label>目标均价 (¥/g)</label>
          <input type="number" id="targetAvg1" placeholder="480.00" step="0.01" value="480.00">
        </div>

        <button class="calc-btn" id="calcBuyBtn">计 算 需 买 克 数</button>

        <div class="result-box">
          <span class="result-label">需要买入</span>
          <span class="result-value empty" id="buyResult">—</span>
        </div>
      </div>

      <!-- 右侧/第二个：新均价预估 -->
      <div class="calc-card" id="card-avg">
        <div class="card-header">
          <div class="card-title">新均价预估</div>
          <div class="card-tag">NEW AVG</div>
        </div>

        <div class="input-group">
          <label>当前均价 (¥/g)</label>
          <input type="number" id="avgPrice2" placeholder="480.00" step="0.01" value="450.00">
        </div>
        <div class="input-group">
          <label>持有克数 (g)</label>
          <input type="number" id="holdGrams2" placeholder="20.00" step="0.01" value="20.00">
        </div>
        <div class="input-group">
          <label>当前金价 (¥/g)</label>
          <input type="number" id="currentPrice2" placeholder="500.00" step="0.01" value="500.00">
        </div>
        <div class="input-group">
          <label>打算买入 (g)</label>
          <input type="number" id="buyGrams2" placeholder="10.00" step="0.01" value="10.00">
        </div>

        <button class="calc-btn" id="calcAvgBtn">计 算 新 均 价</button>

        <div class="result-box">
          <span class="result-label">买入后均价</span>
          <span class="result-value empty" id="avgResult">—</span>
        </div>
      </div>

    </div>

    <div class="terminal-footer">
      行情仅供参考，决策前请核对银行实际买入/卖出价与交易规则。
    </div>
  </div>

  <script>
    (function() {
      // ================= 1. 手机端切换选项卡逻辑 =================
      const mobileTabBtns = document.querySelectorAll('.mobile-tab-btn');
      const tabSlider = document.getElementById('tabSlider');
      const cardBuy = document.getElementById('card-buy');
      const cardAvg = document.getElementById('card-avg');

      mobileTabBtns.forEach((btn, index) => {
        btn.addEventListener('click', () => {
          mobileTabBtns.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');

          tabSlider.style.transform = `translateX(${index * 100}%)`;

          if (index === 0) {
            cardBuy.classList.add('active-card');
            cardAvg.classList.remove('active-card');
          } else {
            cardAvg.classList.add('active-card');
            cardBuy.classList.remove('active-card');
          }
        });
      });

      // ================= 2. 主题切换逻辑 =================
      const themeToggle = document.getElementById('themeToggle');
      const htmlElement = document.documentElement;

      const savedTheme = localStorage.getItem('theme') || 'light';
      htmlElement.setAttribute('data-theme', savedTheme);

      themeToggle.addEventListener('click', (e) => {
        const currentTheme = htmlElement.getAttribute('data-theme');
        const newTheme = currentTheme === 'light' ? 'dark' : 'light';

        const rect = themeToggle.getBoundingClientRect();
        const x = e.clientX || (rect.left + rect.width / 2);
        const y = e.clientY || (rect.top + rect.height / 2);
        
        if (document.startViewTransition) {
          htmlElement.style.setProperty('--click-x', `${x}px`);
          htmlElement.style.setProperty('--click-y', `${y}px`);
          
          document.startViewTransition(() => {
            htmlElement.setAttribute('data-theme', newTheme);
          });
        } else {
          document.body.style.transition = 'background-color 1.2s ease, color 1.2s ease';
          htmlElement.setAttribute('data-theme', newTheme);
        }

        localStorage.setItem('theme', newTheme);
      });

      // ================= 3. 计算器核心逻辑 =================
      function parseInput(value) {
        const num = parseFloat(value);
        return isNaN(num) ? null : num;
      }

      function formatNumber(num, decimals = 2) {
        if (num === null || isNaN(num)) return '—';
        return Number(num.toFixed(decimals)).toString();
      }

      function setResult(element, text) {
        if (text === null || text === undefined) {
          element.textContent = '—';
          element.classList.add('empty');
        } else {
          element.textContent = text;
          element.classList.remove('empty');
        }
      }

      function calcRequiredBuy() {
        const avgPrice = parseInput(document.getElementById('avgPrice1').value);
        const holdGrams = parseInput(document.getElementById('holdGrams1').value);
        const currentPrice = parseInput(document.getElementById('currentPrice1').value);
        const targetAvg = parseInput(document.getElementById('targetAvg1').value);
        const resultEl = document.getElementById('buyResult');

        if (avgPrice === null || holdGrams === null || currentPrice === null || targetAvg === null) {
          setResult(resultEl, '请完整输入');
          return;
        }
        if (avgPrice <= 0 || holdGrams < 0 || currentPrice <= 0 || targetAvg <= 0) {
          setResult(resultEl, '数值需为正');
          return;
        }

        const numerator = holdGrams * (avgPrice - targetAvg);
        const denominator = targetAvg - currentPrice;

        if (Math.abs(denominator) < 1e-12) {
          if (Math.abs(avgPrice - targetAvg) < 1e-12) {
            setResult(resultEl, '0 g (均价不变)');
          } else {
            setResult(resultEl, '无法达到');
          }
          return;
        }

        const requiredBuy = numerator / denominator;

        if (requiredBuy < 0) {
          setResult(resultEl, `${formatNumber(Math.abs(requiredBuy))} g (需卖出)`);
        } else {
          setResult(resultEl, `${formatNumber(requiredBuy)} g`);
        }

        if (Math.abs(requiredBuy) < 0.0001 && requiredBuy >= 0) {
          setResult(resultEl, `0 g`);
        }
      }

      function calcNewAvg() {
        const avgPrice = parseInput(document.getElementById('avgPrice2').value);
        const holdGrams = parseInput(document.getElementById('holdGrams2').value);
        const currentPrice = parseInput(document.getElementById('currentPrice2').value);
        const buyGrams = parseInput(document.getElementById('buyGrams2').value);
        const resultEl = document.getElementById('avgResult');

        if (avgPrice === null || holdGrams === null || currentPrice === null || buyGrams === null) {
          setResult(resultEl, '请完整输入');
          return;
        }
        if (avgPrice <= 0 || holdGrams < 0 || currentPrice <= 0 || buyGrams < 0) {
          setResult(resultEl, '数值需为正');
          return;
        }

        const totalCost = avgPrice * holdGrams + currentPrice * buyGrams;
        const totalGrams = holdGrams + buyGrams;

        if (totalGrams <= 0) {
          setResult(resultEl, '克数不能全为0');
          return;
        }

        const newAvg = totalCost / totalGrams;
        let displayAvg = formatNumber(newAvg);
        setResult(resultEl, `${displayAvg} ¥/g`);
      }

      function init() {
        document.getElementById('calcBuyBtn').addEventListener('click', calcRequiredBuy);
        document.getElementById('calcAvgBtn').addEventListener('click', calcNewAvg);

        const inputIds1 = ['avgPrice1', 'holdGrams1', 'currentPrice1', 'targetAvg1'];
        const inputIds2 = ['avgPrice2', 'holdGrams2', 'currentPrice2', 'buyGrams2'];

        inputIds1.forEach(id => {
          document.getElementById(id).addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); calcRequiredBuy(); }
          });
        });

        inputIds2.forEach(id => {
          document.getElementById(id).addEventListener('keypress', (e) => {
            if (e.key === 'Enter') { e.preventDefault(); calcNewAvg(); }
          });
        });

        // 初始化时跑一遍计算
        calcRequiredBuy();
        calcNewAvg();
      }

      window.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
